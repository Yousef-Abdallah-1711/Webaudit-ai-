<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{font-family:var(--font-sans);background:var(--surface-page);color:var(--text-primary);padding:20px;box-sizing:border-box}.row{display:flex;gap:12px}.sw{flex:1}.chip{height:56px;border:var(--border-width) solid var(--border-default)}.n{font:var(--type-small);font-weight:500;margin-top:8px}.h{font:var(--type-small);color:var(--text-muted);font-family:var(--font-mono);font-size:12px}.chip{height:80px}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--gradient-cta)"></div><div class="n">gradient-cta</div><div class="h">#f97316 → #ef4444</div></div><div class="sw"><div class="chip" style="background:var(--wash-br)"></div><div class="n">wash-br</div><div class="h">corner wash, 40%</div></div><div class="sw"><div class="chip" style="background:var(--wash-tl)"></div><div class="n">wash-tl</div><div class="h">corner wash, 50%</div></div></div></body></html>
