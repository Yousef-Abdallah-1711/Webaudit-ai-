<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{font-family:var(--font-sans);background:var(--surface-page);color:var(--text-primary);padding:20px;box-sizing:border-box}.row{display:flex;gap:12px}.sw{flex:1}.chip{height:56px;border:var(--border-width) solid var(--border-default)}.n{font:var(--type-small);font-weight:500;margin-top:8px}.h{font:var(--type-small);color:var(--text-muted);font-family:var(--font-mono);font-size:12px}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--surface-page)"></div><div class="n">page</div><div class="h">#ffffff</div></div><div class="sw"><div class="chip" style="background:var(--surface-raised)"></div><div class="n">raised</div><div class="h">#fafafa</div></div><div class="sw"><div class="chip" style="background:var(--surface-sunken)"></div><div class="n">sunken</div><div class="h">#f9fafb</div></div><div class="sw"><div class="chip" style="background:var(--surface-inverse)"></div><div class="n">inverse</div><div class="h">#1f2937</div></div><div class="sw"><div class="chip" style="background:var(--border-subtle)"></div><div class="n">border-subtle</div><div class="h">#e5e5e5</div></div><div class="sw"><div class="chip" style="background:var(--border-default)"></div><div class="n">border-default</div><div class="h">#e5e7eb</div></div></div></body></html>
