<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{font-family:var(--font-sans);background:var(--surface-page);color:var(--text-primary);padding:20px;box-sizing:border-box}.row{display:flex;gap:24px}.b{width:150px;height:70px;background:#fff;border:var(--border-width) solid var(--border-default);border-radius:8px}.n{font:var(--type-small);font-weight:500;margin-top:10px}.h{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head><body><div class="row"><div><div class="b" style="box-shadow:var(--shadow-card)"></div><div class="n">shadow-card</div><div class="h">0 1px 2px /.1</div></div><div><div class="b" style="box-shadow:var(--shadow-float)"></div><div class="n">shadow-float</div><div class="h">0 1px 3px /.15, 0 0 20px /.1</div></div><div><div class="b" style="box-shadow:var(--shadow-focus)"></div><div class="n">shadow-focus</div><div class="h">0 0 0 1px #fa7014</div></div></div></body></html>
