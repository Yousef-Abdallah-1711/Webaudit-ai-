# WebAudit AI — production reverse proxy.
# Phase 8 (production-without-Paymob-or-AI master plan), P8-T5.
#
# One hop in front of apps/api and apps/web — apps/api's own `TRUST_PROXY_HOPS`
# (docker-compose.production.yml) must equal exactly the number of proxies
# between the real client and the app, which this file makes true by
# construction: nothing else sits between a browser and this container.
#
# Routes:
#   /realtime  -> apps/api (WebSocket upgrade — the live scan-progress feed,
#                 `apps/api/src/services/realtime/server.ts`'s own `path:
#                 '/realtime'`)
#   /<api-ish> -> apps/api for every other backend path a browser calls
#                 directly (infrastructure/deploy.md's own network note:
#                 "the browser itself talks directly to apps/api for
#                 client-side fetches") — matched by the same route prefixes
#                 apps/api actually mounts, not a single catch-all, so a
#                 typo'd path falls through to apps/web (a real 404 from
#                 Next) rather than a confusing proxy error.
#   /          -> apps/web for everything else (SSR pages, static assets).
#
# TLS: this file expects real certificates already present at
# /etc/nginx/certs/fullchain.pem and /etc/nginx/certs/privkey.pem (the
# `proxy-certs` volume in docker-compose.production.yml). Provisioning and
# renewing them (e.g. certbot/ACME) is a real operational task this file
# does not automate — it is infrastructure-provider-specific (a managed LB's
# own TLS, or a certbot sidecar/cron), genuinely outside what this
# repository's source can decide (discovery's own §29 finding, reconfirmed
# here). Uncomment the `listen 443` server block and its cert paths once a
# real certificate exists; the HTTP-only block below is what actually runs
# until then, so a fresh deployment is never silently unreachable while
# waiting on a certificate.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # WebSocket upgrade — shared by every location that proxies to apps/api.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream webaudit_api {
    server api:3001;
  }

  upstream webaudit_web {
    server web:3000;
  }

  # Plain HTTP — real today. Serves the app immediately on a fresh
  # deployment with no certificate yet; once a real certificate exists,
  # uncomment the `server { listen 443 ssl; ... }` block below and change
  # this block to a 301 redirect to https, per the commented example.
  server {
    listen 80;
    server_name _;

    location = /healthz {
      access_log off;
      return 200 "ok\n";
    }

    # Uncomment once TLS is provisioned, and delete the two `location` blocks
    # below this comment in this server block:
    # return 301 https://$host$request_uri;

    location /realtime {
      proxy_pass http://webaudit_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
    }

    # Every real apps/api route prefix this deployment's frontend calls
    # directly from the browser (infrastructure/deploy.md's own network
    # note). Listed explicitly rather than a catch-all `location /` for
    # apps/api, so an unrecognized path falls through to apps/web's own
    # (real) 404 instead of a proxy 502.
    location ~ ^/(auth|admin|billing|webhooks|scans|targets|issues|repos|plans|health)(/|$) {
      proxy_pass http://webaudit_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://webaudit_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # server {
  #   listen 443 ssl;
  #   http2 on;
  #   server_name _;
  #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #   ssl_protocols TLSv1.2 TLSv1.3;
  #
  #   location = /healthz { access_log off; return 200 "ok\n"; }
  #
  #   location /realtime {
  #     proxy_pass http://webaudit_api;
  #     proxy_http_version 1.1;
  #     proxy_set_header Upgrade $http_upgrade;
  #     proxy_set_header Connection $connection_upgrade;
  #     proxy_set_header Host $host;
  #     proxy_set_header X-Real-IP $remote_addr;
  #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #     proxy_set_header X-Forwarded-Proto $scheme;
  #     proxy_read_timeout 3600s;
  #   }
  #
  #   location ~ ^/(auth|admin|billing|webhooks|scans|targets|issues|repos|plans|health)(/|$) {
  #     proxy_pass http://webaudit_api;
  #     proxy_http_version 1.1;
  #     proxy_set_header Host $host;
  #     proxy_set_header X-Real-IP $remote_addr;
  #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #     proxy_set_header X-Forwarded-Proto $scheme;
  #   }
  #
  #   location / {
